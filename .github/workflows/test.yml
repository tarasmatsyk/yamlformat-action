name: Test action

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Accept formatted YAML
        uses: ./
        with:
          paths: tests/fixtures/**/*.yaml
          config-file: tests/fixtures/yamlfmt-config.yaml
          yamlfmt-version: 0.21.0

      - name: Reject unformatted YAML
        id: unformatted
        uses: ./
        continue-on-error: true
        with:
          paths: tests/fixtures/unformatted.yaml

      - name: Assert unformatted YAML failed for the expected reason
        if: always()
        env:
          OUTCOME: ${{ steps.unformatted.outcome }}
          REASON: ${{ steps.unformatted.outputs.failure-reason }}
        run: |
          test "$OUTCOME" = failure
          test "$REASON" = formatting-failed

      - name: Reject invalid yamlfmt configuration
        id: invalid-config
        uses: ./
        continue-on-error: true
        with:
          paths: tests/fixtures/formatted.yaml
          config-file: tests/fixtures/invalid-yamlfmt-config.yaml

      - name: Assert configuration error has the expected reason
        if: always()
        env:
          OUTCOME: ${{ steps.invalid-config.outcome }}
          REASON: ${{ steps.invalid-config.outputs.failure-reason }}
        run: |
          test "$OUTCOME" = failure
          test "$REASON" = yamlfmt-error

      - name: Reject patterns with no matches
        id: no-match
        uses: ./
        continue-on-error: true
        with:
          paths: tests/fixtures/missing/**/*.yaml
          dstar: true

      - name: Assert empty glob failed for the expected reason
        if: always()
        env:
          OUTCOME: ${{ steps.no-match.outcome }}
          REASON: ${{ steps.no-match.outputs.failure-reason }}
        run: |
          test "$OUTCOME" = failure
          test "$REASON" = no-matches

      - name: Reject one unmatched pattern alongside a matching path
        id: partial-no-match
        uses: ./
        continue-on-error: true
        with:
          paths: |
            tests/fixtures/formatted.yaml
            tests/fixtures/missing/**/*.yaml
          dstar: true

      - name: Assert partial glob match failed for the expected reason
        if: always()
        env:
          OUTCOME: ${{ steps.partial-no-match.outcome }}
          REASON: ${{ steps.partial-no-match.outputs.failure-reason }}
        run: |
          test "$OUTCOME" = failure
          test "$REASON" = no-matches

      - name: Reject empty folder without doublestar
        id: empty-folder
        uses: ./
        continue-on-error: true
        with:
          paths: tests/fixtures/empty

      - name: Assert empty folder failed for the expected reason
        if: always()
        env:
          OUTCOME: ${{ steps.empty-folder.outcome }}
          REASON: ${{ steps.empty-folder.outputs.failure-reason }}
        run: |
          test "$OUTCOME" = failure
          test "$REASON" = no-matches
