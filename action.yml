name: yamlformat-action
description: Check YAML formatting in selected paths with Google's yamlfmt
author: tarasmatsyk
branding:
  icon: file-text
  color: blue
inputs:
  paths:
    description: Newline-separated files, directories, or glob patterns to check
    required: false
    default: .
  dstar:
    description: Enable yamlfmt doublestar glob patterns; use patterns instead of directory paths
    required: false
    default: 'false'
  config-file:
    description: Path to the yamlfmt config file, passed as -conf
    required: false
  yamlfmt-version:
    description: yamlfmt release version to install
    required: false
    default: v0.21.0
outputs:
  failure-reason:
    description: Machine-readable reason for a formatting check failure
    value: ${{ steps.check.outputs.failure-reason }}
runs:
  using: composite
  steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
    - name: Install yamlfmt and check formatting
      id: check
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_DSTAR: ${{ inputs.dstar }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        YAMLFMT_VERSION: ${{ inputs.yamlfmt-version }}
      run: ${{ github.action_path }}/entrypoint.sh
